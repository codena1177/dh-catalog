<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>대웅제약 디지털헬스 제품 카탈로그</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #f5f6f8; color: #1a1a2e; font-size: 14px; }

  /* ── 헤더 ── */
  .header {
    background: #fff;
    border-bottom: 1px solid #e8e9ed;
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .brand-badge {
    background: #003087;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 4px 9px;
    border-radius: 4px;
  }
  .header-title { font-size: 15px; font-weight: 600; color: #1a1a2e; }
  .header-right { display: flex; gap: 10px; }
  .btn-outline {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid #d0d3dc; background: #fff;
    color: #444; font-size: 13px; padding: 6px 14px;
    border-radius: 6px; cursor: pointer; transition: all 0.15s;
  }
  .btn-outline:hover { border-color: #003087; color: #003087; }

  /* ── 레이아웃 ── */
  .layout { display: flex; height: calc(100vh - 56px); }

  /* ── 사이드바 ── */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: #fff;
    border-right: 1px solid #e8e9ed;
    display: flex;
    flex-direction: column;
    padding: 20px 16px;
    gap: 0;
    overflow-y: auto;
  }
  .selected-count {
    background: #f0f4ff;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 20px;
  }
  .selected-count .num { font-size: 24px; font-weight: 700; color: #003087; }
  .selected-count .label { font-size: 12px; color: #666; margin-top: 2px; }

  .filter-section { margin-bottom: 20px; }
  .filter-title {
    font-size: 12px;
    font-weight: 600;
    color: #888;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  /* ── 기능분류 슬라이서 ── */
  .slicer-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .slicer-btn {
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 500;
    border: 1.5px solid #d8dae0;
    background: #fff;
    color: #555;
    border-radius: 7px;
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.15s;
    line-height: 1.3;
    width: 100%;
  }
  .slicer-btn:hover { border-color: #aaa; background: #f7f7f7; }

  /* 전체 버튼 */
  .slicer-btn.all-btn.active { background: #1a1a2e; border-color: #1a1a2e; color: #fff; font-weight: 600; }
  .slicer-btn.all-btn:hover  { background: #f0f0f0; border-color: #aaa; color: #1a1a2e; }

  /* 예방·예측 — 노란색 */
  .slicer-btn[data-func="예방·예측"].active { background: #fffbe6; border-color: #f5c400; color: #7a5c00; font-weight: 600; }
  .slicer-btn[data-func="예방·예측"]:hover  { background: #fffbe6; border-color: #f5c400; color: #7a5c00; }

  /* 진단 — 초록색 */
  .slicer-btn[data-func="진단"].active { background: #edfaf3; border-color: #2dbc6e; color: #0e6b3a; font-weight: 600; }
  .slicer-btn[data-func="진단"]:hover  { background: #edfaf3; border-color: #2dbc6e; color: #0e6b3a; }

  /* 치료 — 파란색 */
  .slicer-btn[data-func="치료"].active { background: #e8f0fe; border-color: #2563eb; color: #1040a8; font-weight: 600; }
  .slicer-btn[data-func="치료"]:hover  { background: #e8f0fe; border-color: #2563eb; color: #1040a8; }

  /* 사후관리 — 주황색 */
  .slicer-btn[data-func="사후관리"].active { background: #fff3e8; border-color: #f07820; color: #8a3e00; font-weight: 600; }
  .slicer-btn[data-func="사후관리"]:hover  { background: #fff3e8; border-color: #f07820; color: #8a3e00; }

  /* 색상 힌트 도트 */
  .slicer-btn .dot { flex-shrink: 0; width: 9px; height: 9px; border-radius: 50%; }
  .dot-prev   { background: #f5c400; }
  .dot-diag   { background: #2dbc6e; }
  .dot-treat  { background: #2563eb; }
  .dot-after  { background: #f07820; }

  /* 질환 계통 입력 */
  .filter-input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #d8dae0;
    border-radius: 7px;
    font-size: 13px;
    color: #555;
    background: #f9f9fb;
    outline: none;
    transition: border-color 0.15s;
  }
  .filter-input:focus { border-color: #003087; background: #fff; }
  .filter-input::placeholder { color: #bbb; }

  .reset-btn {
    background: none;
    border: none;
    color: #888;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0;
    margin-top: 4px;
    transition: color 0.15s;
  }
  .reset-btn:hover { color: #003087; }

  .sidebar-actions { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .btn-primary {
    background: #003087;
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.15s;
  }
  .btn-primary:hover { background: #00256b; }
  .btn-ghost {
    background: #fff;
    color: #555;
    border: 1px solid #d8dae0;
    border-radius: 7px;
    padding: 9px;
    font-size: 13px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .btn-ghost:hover { border-color: #003087; color: #003087; }

  /* ── 메인 콘텐츠 ── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* 탭 */
  .tab-bar {
    display: flex;
    background: #fff;
    border-bottom: 1px solid #e8e9ed;
  }
  .tab {
    flex: 1;
    padding: 14px;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    color: #888;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .tab:hover { color: #003087; }
  .tab.active { color: #003087; border-bottom-color: #003087; font-weight: 600; }

  /* 탭 패널 */
  .tab-panel { display: none; flex: 1; overflow: hidden; }
  .tab-panel.active { display: flex; flex-direction: column; }

  /* ── 전체 탐색 탭 ── */
  .browse-header {
    padding: 16px 20px 12px;
    background: #fff;
    border-bottom: 1px solid #e8e9ed;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .browse-header .count-text { font-size: 13px; color: #666; }
  .browse-header .count-text b { color: #003087; }

  .product-grid-wrap { flex: 1; overflow-y: auto; padding: 20px; }
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .product-card {
    background: #fff;
    border: 1px solid #e8e9ed;
    border-radius: 10px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  .product-card:hover { border-color: #003087; box-shadow: 0 2px 12px rgba(0,48,135,0.08); transform: translateY(-1px); }
  .product-card.selected { border-color: #003087; background: #f0f4ff; }
  .product-card.hidden { display: none; }

  .card-check {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 18px;
    height: 18px;
    border: 1.5px solid #d0d3dc;
    border-radius: 4px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .product-card.selected .card-check { background: #003087; border-color: #003087; }
  .card-check-mark { color: #fff; font-size: 11px; display: none; }
  .product-card.selected .card-check-mark { display: block; }

  .card-func-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 9px;
  }
  .func-예방·예측 { background: #fffbe6; color: #7a5c00; }
  .func-진단      { background: #edfaf3; color: #0e6b3a; }
  .func-치료      { background: #e8f0fe; color: #1040a8; }
  .func-사후관리  { background: #fff3e8; color: #8a3e00; }
  .func-기타      { background: #f0f0f0; color: #555; }

  .card-name { font-size: 14px; font-weight: 600; color: #1a1a2e; margin-bottom: 4px; padding-right: 24px; }
  .card-developer { font-size: 12px; color: #888; margin-bottom: 8px; }
  .card-desc { font-size: 12px; color: #555; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-category-tag {
    margin-top: 10px;
    font-size: 11px;
    color: #999;
    border-top: 1px solid #f0f0f0;
    padding-top: 8px;
  }

  .no-result {
    text-align: center;
    padding: 60px 20px;
    color: #aaa;
    font-size: 14px;
    display: none;
  }
  .no-result.show { display: block; }

  /* ── 편집 탭 ── */
  .edit-panel {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  .edit-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .edit-header h3 { font-size: 15px; font-weight: 600; }
  .btn-add {
    background: #003087;
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-add:hover { background: #00256b; }

  .product-edit-card {
    background: #fff;
    border: 1px solid #e8e9ed;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .edit-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .edit-card-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .btn-delete {
    background: none;
    border: 1px solid #fcd5d5;
    color: #e05050;
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-delete:hover { background: #fff0f0; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-label { font-size: 12px; font-weight: 500; color: #555; }
  .form-control {
    border: 1px solid #d8dae0;
    border-radius: 7px;
    padding: 9px 12px;
    font-size: 13px;
    color: #1a1a2e;
    outline: none;
    transition: border-color 0.15s;
    font-family: inherit;
    background: #fff;
  }
  .form-control:focus { border-color: #003087; }
  .form-control::placeholder { color: #bbb; }
  textarea.form-control { resize: vertical; min-height: 80px; }

  /* 기능분류 셀렉트 강조 */
  select.form-control { cursor: pointer; }

  /* ── 미리보기 탭 ── */
  .preview-panel { flex: 1; overflow-y: auto; }
  .preview-header {
    padding: 16px 24px;
    background: #fff;
    border-bottom: 1px solid #e8e9ed;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .preview-header h3 { font-size: 15px; font-weight: 600; }
  .preview-count { font-size: 13px; color: #666; }
  .preview-grid { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .preview-card {
    background: #fff;
    border-radius: 12px;
    border: 1px solid #e8e9ed;
    padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .preview-card-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .preview-card-dev { font-size: 12px; color: #888; margin-bottom: 12px; }
  .preview-card-desc { font-size: 13px; color: #555; line-height: 1.7; margin-bottom: 14px; }
  .preview-card-meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .meta-tag {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 20px;
    background: #f0f4ff;
    color: #2152b3;
    font-weight: 500;
  }

  /* 필터 결과 뱃지 */
  .filter-status {
    font-size: 12px;
    color: #003087;
    background: #f0f4ff;
    border-radius: 5px;
    padding: 3px 9px;
    font-weight: 600;
  }

  /* 스크롤바 */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d8dae0; border-radius: 10px; }
</style>
</head>
<body>

<!-- 헤더 -->
<header class="header">
  <div class="header-left">
    <span class="brand-badge">DAEWOONG</span>
    <span class="header-title">디지털헬스 제품 카탈로그</span>
  </div>
  <div class="header-right">
    <button class="btn-outline" onclick="savePDF()">📄 PDF 저장</button>
    <button class="btn-outline" onclick="shareLink()">🔗 링크 공유</button>
  </div>
</header>

<div class="layout">

  <!-- 사이드바 -->
  <aside class="sidebar">
    <div class="selected-count">
      <div class="num" id="selected-num">0</div>
      <div class="label">개 제품 선택됨</div>
    </div>

    <!-- 질환 계통 필터 -->
    <div class="filter-section">
      <div class="filter-title">질환 계통</div>
      <input type="text" class="filter-input" id="disease-filter" placeholder="질환 계통 입력..." oninput="applyFilters()">
    </div>

    <!-- 기능 분류 슬라이서 -->
    <div class="filter-section">
      <div class="filter-title">기능 분류</div>
      <div class="slicer-grid" id="func-slicer">
        <button class="slicer-btn all-btn active" data-func="all" onclick="setFuncFilter(this)">전체</button>
        <button class="slicer-btn" data-func="예방·예측" onclick="setFuncFilter(this)"><span class="dot dot-prev"></span>예방·예측</button>
        <button class="slicer-btn" data-func="진단"     onclick="setFuncFilter(this)"><span class="dot dot-diag"></span>진단</button>
        <button class="slicer-btn" data-func="치료"     onclick="setFuncFilter(this)"><span class="dot dot-treat"></span>치료</button>
        <button class="slicer-btn" data-func="사후관리" onclick="setFuncFilter(this)"><span class="dot dot-after"></span>사후관리</button>
      </div>
    </div>

    <button class="reset-btn" onclick="resetFilters()">↺ 필터 초기화</button>

    <div class="sidebar-actions">
      <button class="btn-primary" onclick="showTab('preview')">👁 미리보기 보기</button>
      <button class="btn-ghost" onclick="clearSelection()">선택 초기화</button>
    </div>
  </aside>

  <!-- 메인 -->
  <main class="main">
    <div class="tab-bar">
      <div class="tab active" onclick="showTab('browse')">📋 전체 탐색</div>
      <div class="tab" onclick="showTab('preview')">👁 미리보기</div>
      <div class="tab" onclick="showTab('edit')">✏️ 편집</div>
    </div>

    <!-- 전체 탐색 탭 -->
    <div class="tab-panel active" id="tab-browse">
      <div class="browse-header">
        <div class="count-text">
          <b id="shown-count">0</b>개 표시 중
        </div>
        <div id="filter-status-badge"></div>
      </div>
      <div class="product-grid-wrap">
        <div class="product-grid" id="product-grid"></div>
        <div class="no-result" id="no-result">조건에 맞는 제품이 없습니다.</div>
      </div>
    </div>

    <!-- 미리보기 탭 -->
    <div class="tab-panel" id="tab-preview">
      <div class="preview-header">
        <h3>선택된 제품 미리보기</h3>
        <span class="preview-count" id="preview-count">0개 선택됨</span>
      </div>
      <div class="preview-grid" id="preview-grid">
        <p style="color:#aaa;font-size:13px;padding:20px">선택된 제품이 없습니다. 전체 탐색에서 제품을 선택하세요.</p>
      </div>
    </div>

    <!-- 편집 탭 -->
    <div class="tab-panel" id="tab-edit">
      <div class="edit-panel">
        <div class="edit-header">
          <h3>제품 편집</h3>
          <button class="btn-add" onclick="addProduct()">＋ 새 제품 추가</button>
        </div>
        <div id="edit-list"></div>
      </div>
    </div>
  </main>
</div>

<script>
// ── 제품 데이터 ──
// data/products.json 에서 로드하거나 여기에 직접 입력
let products = [];

// JSON 파일 로드 시도 (없으면 빈 배열)
fetch('./data/products.json')
  .then(r => r.ok ? r.json() : [])
  .then(data => {
    products = Array.isArray(data) ? data : [];
    // id가 없는 경우 자동 부여
    products = products.map((p, i) => ({ id: p.id || (i + 1), ...p }));
    renderAll();
  })
  .catch(() => {
    // products.json이 없으면 샘플 데이터로 시작
    products = [
      {
        id: 1,
        name: '에티아 (AITIA)',
        category: 'AI 심전도 분석',
        developer: 'MedicalAI',
        seller: '대웅제약',
        desc: '12유도 심전도 데이터를 AI로 분석하여 좌심실수축기능부전, 좌심실이완기능부전, 중증 대동맥판막 협착증 가능성을 점수와 위험도로 표시하는 소프트웨어 의료기기입니다.',
        disease: '순환기계',
        funcCategory: '진단',
        targetDisease: '좌심실수축기능부전, 심방세동',
        reimbursement: ''
      }
    ];
    renderAll();
  });

let selectedIds = new Set();
let currentFuncFilter = 'all';
let diseaseFilter = '';

// ── 필터 적용 ──
function setFuncFilter(btn) {
  document.querySelectorAll('[data-func]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFuncFilter = btn.dataset.func;
  applyFilters();
}

function applyFilters() {
  diseaseFilter = document.getElementById('disease-filter').value.trim().toLowerCase();
  renderBrowse();
}

function resetFilters() {
  currentFuncFilter = 'all';
  diseaseFilter = '';
  document.getElementById('disease-filter').value = '';
  document.querySelectorAll('[data-func]').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-func="all"]').classList.add('active');
  renderBrowse();
}

// ── 렌더링 ──
function renderAll() {
  renderBrowse();
  renderEdit();
}

function renderBrowse() {
  const grid = document.getElementById('product-grid');
  const noResult = document.getElementById('no-result');
  const shownCount = document.getElementById('shown-count');
  const statusBadge = document.getElementById('filter-status-badge');

  grid.innerHTML = '';
  let shown = 0;

  products.forEach(p => {
    const funcMatch = currentFuncFilter === 'all' || p.funcCategory === currentFuncFilter;
    const diseaseMatch = !diseaseFilter || (p.disease || '').toLowerCase().includes(diseaseFilter);
    if (!funcMatch || !diseaseMatch) return;

    shown++;
    const isSelected = selectedIds.has(p.id);
    const funcClass = 'func-' + (p.funcCategory || '기타');

    const card = document.createElement('div');
    card.className = 'product-card' + (isSelected ? ' selected' : '');
    card.dataset.id = p.id;
    card.innerHTML = `
      <div class="card-check"><span class="card-check-mark">✓</span></div>
      <div class="card-func-badge ${funcClass}">${p.funcCategory || '미분류'}</div>
      <div class="card-name">${p.name}</div>
      <div class="card-developer">${p.developer || ''} · ${p.seller || ''}</div>
      <div class="card-desc">${p.desc || ''}</div>
      <div class="card-category-tag">📁 ${p.disease || '—'} ${p.targetDisease ? '· ' + p.targetDisease : ''}</div>
    `;
    card.onclick = () => toggleSelect(p.id);
    grid.appendChild(card);
  });

  shownCount.textContent = shown;
  noResult.classList.toggle('show', shown === 0);

  // 필터 상태 뱃지
  if (currentFuncFilter !== 'all') {
    statusBadge.innerHTML = `<span class="filter-status">🔍 ${currentFuncFilter}</span>`;
  } else {
    statusBadge.innerHTML = '';
  }
}

function toggleSelect(id) {
  if (selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  document.getElementById('selected-num').textContent = selectedIds.size;
  renderBrowse();
  renderPreview();
}

function clearSelection() {
  selectedIds.clear();
  document.getElementById('selected-num').textContent = 0;
  renderBrowse();
  renderPreview();
}

function renderPreview() {
  const grid = document.getElementById('preview-grid');
  const count = document.getElementById('preview-count');
  const selected = products.filter(p => selectedIds.has(p.id));
  count.textContent = selected.length + '개 선택됨';

  if (selected.length === 0) {
    grid.innerHTML = '<p style="color:#aaa;font-size:13px;padding:20px">선택된 제품이 없습니다. 전체 탐색에서 제품을 선택하세요.</p>';
    return;
  }
  grid.innerHTML = selected.map(p => `
    <div class="preview-card">
      <div class="card-func-badge func-${p.funcCategory || '기타'}" style="margin-bottom:10px">${p.funcCategory || '미분류'}</div>
      <div class="preview-card-name">${p.name}</div>
      <div class="preview-card-dev">${p.developer || ''} · ${p.seller || ''}</div>
      <div class="preview-card-desc">${p.desc || ''}</div>
      <div class="preview-card-meta">
        ${p.disease ? `<span class="meta-tag">${p.disease}</span>` : ''}
        ${p.targetDisease ? p.targetDisease.split(',').map(t => `<span class="meta-tag">${t.trim()}</span>`).join('') : ''}
        ${p.reimbursement ? `<span class="meta-tag" style="background:#fff8e6;color:#9b6e00">${p.reimbursement}</span>` : ''}
      </div>
    </div>
  `).join('');
}

function renderEdit() {
  const list = document.getElementById('edit-list');
  list.innerHTML = products.map(p => `
    <div class="product-edit-card" id="edit-card-${p.id}">
      <div class="edit-card-header">
        <div class="edit-card-title">
          <span class="card-func-badge func-${p.funcCategory || '기타'}">${p.funcCategory || '미분류'}</span>
          ${p.name}
        </div>
        <button class="btn-delete" onclick="deleteProduct(${p.id})">삭제</button>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">제품명</label>
          <input class="form-control" value="${p.name || ''}" oninput="updateField(${p.id},'name',this.value)" placeholder="제품명">
        </div>
        <div class="form-group">
          <label class="form-label">카테고리</label>
          <input class="form-control" value="${p.category || ''}" oninput="updateField(${p.id},'category',this.value)" placeholder="예: AI 심전도 분석">
        </div>
        <div class="form-group">
          <label class="form-label">원개발사</label>
          <input class="form-control" value="${p.developer || ''}" oninput="updateField(${p.id},'developer',this.value)" placeholder="원개발사">
        </div>
        <div class="form-group">
          <label class="form-label">판매사</label>
          <input class="form-control" value="${p.seller || ''}" oninput="updateField(${p.id},'seller',this.value)" placeholder="판매사">
        </div>
        <div class="form-group full">
          <label class="form-label">제품 설명</label>
          <textarea class="form-control" oninput="updateField(${p.id},'desc',this.value)" placeholder="제품 설명">${p.desc || ''}</textarea>
        </div>
        <div class="form-group">
          <label class="form-label">질환 계통</label>
          <input class="form-control" value="${p.disease || ''}" oninput="updateField(${p.id},'disease',this.value)" placeholder="예: 순환기계, 근골격계">
        </div>
        <div class="form-group">
          <label class="form-label">기능 분류</label>
          <select class="form-control" onchange="updateField(${p.id},'funcCategory',this.value)">
            <option value="">선택하세요</option>
            <option value="예방·예측" ${p.funcCategory==='예방·예측'?'selected':''}>예방·예측</option>
            <option value="진단"       ${p.funcCategory==='진단'?'selected':''}>진단</option>
            <option value="치료"       ${p.funcCategory==='치료'?'selected':''}>치료</option>
            <option value="사후관리"   ${p.funcCategory==='사후관리'?'selected':''}>사후관리</option>
          </select>
        </div>
        <div class="form-group full">
          <label class="form-label">타겟 질환</label>
          <input class="form-control" value="${p.targetDisease || ''}" oninput="updateField(${p.id},'targetDisease',this.value)" placeholder="예: 좌심실수축기능부전, 심방세동">
        </div>
        <div class="form-group full">
          <label class="form-label">수가 / 청구 코드</label>
          <input class="form-control" value="${p.reimbursement || ''}" oninput="updateField(${p.id},'reimbursement',this.value)" placeholder="수가 코드">
        </div>
      </div>
    </div>
  `).join('');
}

function updateField(id, field, value) {
  const p = products.find(p => p.id === id);
  if (p) {
    p[field] = value;
    renderBrowse();
    renderPreview();
    // 편집 카드 헤더만 업데이트
    const card = document.getElementById('edit-card-' + id);
    if (card && (field === 'name' || field === 'funcCategory')) {
      const title = card.querySelector('.edit-card-title');
      title.innerHTML = `<span class="card-func-badge func-${p.funcCategory || '기타'}">${p.funcCategory || '미분류'}</span> ${p.name}`;
    }
    saveToStorage();
  }
}

function addProduct() {
  const newId = Date.now();
  products.push({
    id: newId, name: '새 제품', category: '', developer: '',
    seller: '대웅제약', desc: '', disease: '',
    funcCategory: '', targetDisease: '', reimbursement: ''
  });
  renderAll();
  saveToStorage();
  // 새 카드로 스크롤
  setTimeout(() => {
    const el = document.getElementById('edit-card-' + newId);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

function deleteProduct(id) {
  if (!confirm('이 제품을 삭제하시겠습니까?')) return;
  products = products.filter(p => p.id !== id);
  selectedIds.delete(id);
  document.getElementById('selected-num').textContent = selectedIds.size;
  renderAll();
  saveToStorage();
}

// ── 탭 전환 ──
function showTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    const names = ['browse', 'preview', 'edit'];
    t.classList.toggle('active', names[i] === name);
  });
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'preview') renderPreview();
}

// ── 로컬 저장 (선택적) ──
function saveToStorage() {
  try { localStorage.setItem('dh-catalog-products', JSON.stringify(products)); } catch(e) {}
}

// ── PDF / 공유 ──
function savePDF() { window.print(); }
function shareLink() {
  navigator.clipboard.writeText(location.href)
    .then(() => alert('링크가 복사되었습니다!'))
    .catch(() => alert(location.href));
}
</script>
</body>
</html>
