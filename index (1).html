<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>대웅제약 디지털헬스 제품 카탈로그</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:#f7f7f5;color:#1a1a1a;font-size:14px}
a{color:inherit;text-decoration:none}

/* ── Layout ── */
.app{display:flex;flex-direction:column;min-height:100vh}

/* Header */
.header{background:#fff;border-bottom:1px solid #e8e8e8;padding:0 1rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:200}
.header-left{display:flex;align-items:center;gap:10px;min-width:0}
.logo-badge{background:#185FA5;color:#fff;font-size:10px;font-weight:600;padding:3px 8px;border-radius:5px;letter-spacing:.04em;flex-shrink:0}
.header h1{font-size:14px;font-weight:500;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-right{display:flex;gap:6px;flex-shrink:0}

/* Header icon buttons (mobile) */
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:1px solid #e0e0e0;background:#fff;cursor:pointer;color:#333}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.icon-btn.active{background:#185FA5;border-color:#185FA5;color:#fff}

/* Desktop header buttons */
.btn-label{display:none}

/* Main layout: desktop sidebar + content, mobile stacked */
.main{display:flex;flex:1;position:relative}

/* Sidebar overlay (mobile) */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150}
.sidebar-overlay.open{display:block}

.sidebar{width:240px;background:#fff;border-right:1px solid #e8e8e8;padding:1.25rem;flex-shrink:0;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;z-index:160}

/* Tabs */
.tabs{display:flex;gap:2px;background:#f0f0ee;border-radius:8px;padding:3px;margin-bottom:1.25rem}
.tab{flex:1;text-align:center;padding:8px 4px;font-size:12px;border-radius:6px;cursor:pointer;border:none;background:transparent;color:#666;transition:all .15s;white-space:nowrap}
.tab.active{background:#fff;color:#1a1a1a;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08)}

.content{flex:1;padding:1.25rem;overflow-y:auto;min-width:0}

/* Sidebar filters */
.sidebar-title{font-size:11px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.filter-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:6px;cursor:pointer;font-size:13px;color:#444;transition:background .1s}
.filter-item:hover,.filter-item:active{background:#f5f5f5}
.filter-item.filter-active{background:#EBF4FF;color:#185FA5;font-weight:500}
.sidebar-section{margin-bottom:1.5rem}
.sel-summary{background:#EBF4FF;border-radius:8px;padding:12px;margin-bottom:1.25rem;font-size:13px}
.sel-summary strong{color:#185FA5;font-size:18px;display:block;margin-bottom:2px}
.sel-summary span{color:#555}

/* Product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative;-webkit-tap-highlight-color:transparent}
.card:active{transform:scale(.98)}
.card.selected{border:2px solid #185FA5;box-shadow:0 0 0 3px rgba(24,95,165,.08)}
.card-img{width:100%;height:100px;background:#f7f7f5;padding:10px;display:flex;align-items:center;justify-content:center;font-size:38px}
.card-img img{width:100%;height:100%;object-fit:contain}
.card-body{padding:10px}
.card-name{font-size:12px;font-weight:500;margin-bottom:2px;line-height:1.4}
.card-cat{font-size:11px;color:#888}
.card-dev{font-size:11px;color:#aaa;margin-top:5px}
.check-ring{position:absolute;top:7px;right:7px;width:20px;height:20px;border-radius:50%;background:#185FA5;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.check-ring svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.5}
.card.selected .check-ring{opacity:1}

/* Preview */
.preview-item{background:#fff;border:1px solid #e8e8e8;border-radius:12px;overflow:hidden;margin-bottom:14px}
.preview-header{display:flex;gap:14px;padding:1rem;align-items:flex-start}
.preview-img{width:72px;height:60px;background:#f7f7f5;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;overflow:hidden}
.preview-img img{width:100%;height:100%;object-fit:contain;padding:4px}
.preview-meta{flex:1;min-width:0}
.preview-name{font-size:15px;font-weight:500;margin-bottom:2px}
.preview-cat{font-size:11px;color:#888;margin-bottom:6px}
.preview-desc{font-size:12px;color:#555;line-height:1.6}
.preview-fields{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#e8e8e8;border-top:1px solid #e8e8e8}
.pfield{background:#fff;padding:12px 14px}
.pfield.full{grid-column:1/-1}
.pfield-label{font-size:10px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.pfield-value{font-size:12px;color:#333}
.hosp-tags{display:flex;flex-wrap:wrap;gap:5px}
.htag{font-size:11px;background:#f5f5f5;border:1px solid #e8e8e8;border-radius:20px;padding:3px 9px;color:#555}
.report-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#185FA5;background:#EBF4FF;border-radius:6px;padding:6px 12px;cursor:pointer;border:none;font-family:inherit}
.report-link svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2}

/* Preview top bar */
.preview-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.preview-topbar-btns{display:flex;gap:6px;flex-wrap:wrap}

/* Edit */
.edit-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:1rem;margin-bottom:12px}
.edit-card-header{display:flex;align-items:center;gap:10px;margin-bottom:1rem;padding-bottom:10px;border-bottom:1px solid #f0f0f0}
.edit-card-title{font-size:14px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit-field{display:flex;flex-direction:column;gap:5px}
.edit-field.full{grid-column:1/-1}
.edit-field label{font-size:11px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.04em}
.edit-field input,.edit-field textarea{border:1px solid #e0e0e0;border-radius:6px;padding:9px 10px;font-size:14px;font-family:inherit;color:#1a1a1a;background:#fff;width:100%;-webkit-appearance:none}
.edit-field input:focus,.edit-field textarea:focus{outline:none;border-color:#185FA5;box-shadow:0 0 0 2px rgba(24,95,165,.1)}
.edit-field textarea{resize:vertical;min-height:70px}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.etag{font-size:12px;background:#f5f5f5;border:1px solid #e0e0e0;border-radius:20px;padding:3px 8px;color:#555;display:flex;align-items:center;gap:4px}
.etag button{border:none;background:none;cursor:pointer;color:#aaa;font-size:14px;line-height:1;padding:0}
.tag-add-row{display:flex;gap:6px}
.tag-add-row input{flex:1}

/* File upload */
.file-upload-area{border:1.5px dashed #d0d0d0;border-radius:8px;padding:14px;text-align:center;cursor:pointer;transition:border-color .15s;background:#fafafa}
.file-upload-area:active{border-color:#185FA5;background:#f0f7ff}
.file-upload-area input{display:none}
.file-upload-area .hint{font-size:12px;color:#aaa;margin-top:4px}
.file-thumb{display:flex;align-items:center;gap:8px;background:#f5f5f5;border-radius:6px;padding:8px 10px;margin-top:8px;font-size:12px;color:#555}
.file-thumb svg{width:16px;height:16px;flex-shrink:0;stroke:#185FA5;fill:none;stroke-width:2}
.file-thumb button{border:none;background:none;cursor:pointer;color:#aaa;margin-left:auto;font-size:14px;padding:4px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid #e0e0e0;background:#fff;color:#333;font-family:inherit;transition:all .15s;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.btn:active{opacity:.8}
.btn-primary{background:#185FA5;color:#fff;border-color:#185FA5}
.btn-danger{color:#e24b4a;border-color:#f7c1c1}
.btn-danger:active{background:#fcebeb}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.btn-row{display:flex;gap:8px;margin-top:1rem;padding-top:1rem;border-top:1px solid #f0f0f0;flex-wrap:wrap}

/* Empty */
.empty{text-align:center;padding:3rem 2rem;color:#bbb}
.empty svg{width:36px;height:36px;stroke:#ddd;fill:none;stroke-width:1.5;display:block;margin:0 auto 10px}
.empty p{font-size:13px}

/* Mobile filter drawer (bottom sheet style) */
.filter-drawer{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:16px 16px 0 0;padding:1rem;z-index:300;box-shadow:0 -4px 24px rgba(0,0,0,.12);max-height:70vh;overflow-y:auto}
.filter-drawer.open{display:block}
.drawer-handle{width:36px;height:4px;background:#e0e0e0;border-radius:2px;margin:0 auto 1rem}
.drawer-close{display:flex;justify-content:flex-end;margin-bottom:.5rem}

/* Selected bar (mobile) */
.sel-bar{display:none;position:fixed;bottom:0;left:0;right:0;background:#185FA5;color:#fff;padding:12px 16px;z-index:100;display:flex;align-items:center;justify-content:space-between}
.sel-bar span{font-size:13px;font-weight:500}
.sel-bar .sel-bar-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:7px 14px;border-radius:7px;font-size:13px;cursor:pointer;font-family:inherit}

/* Toast */
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}

/* Print */
@media print{
  .header,.sidebar,.tabs,.btn-row,.no-print,.sel-bar,.filter-drawer{display:none!important}
  .main{display:block}
  .content{padding:0}
  .preview-item{break-inside:avoid;margin-bottom:24px;border:1px solid #ddd}
  body{background:#fff}
}

/* ── Desktop overrides (≥768px) ── */
@media(min-width:768px){
  .header{height:60px;padding:0 2rem}
  .header h1{font-size:15px}
  .icon-btn{display:none}
  .btn-label{display:inline}
  .header-right .btn{display:inline-flex}
  .sidebar{display:flex!important;flex-direction:column;position:sticky;top:60px;height:calc(100vh - 60px)}
  .sidebar-overlay{display:none!important}
  .filter-drawer{display:none!important}
  .content{padding:2rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .card-img{height:120px;font-size:42px}
  .card-body{padding:12px}
  .card-name{font-size:13px}
  .preview-img{width:100px;height:80px;font-size:36px}
  .preview-header{padding:1.5rem;gap:20px}
  .preview-name{font-size:17px}
  .preview-desc{font-size:13px}
  .pfield{padding:14px 20px}
  .pfield-value{font-size:13px}
  .tab{font-size:13px}
  .sel-bar{display:none!important}
  .toast{bottom:24px;left:auto;right:24px;transform:none}
  .preview-topbar{flex-wrap:nowrap}
}

/* ── Mobile only (< 768px) ── */
@media(max-width:767px){
  .sidebar{display:none;position:fixed;top:0;left:0;bottom:0;width:280px;height:100vh;padding-top:1.5rem;z-index:160;transition:transform .25s}
  .sidebar.open{display:flex;flex-direction:column}
  .header-right .btn{display:none}
  /* bottom padding so content isn't hidden behind sel-bar */
  .content{padding-bottom:70px}
  .edit-grid{grid-template-columns:1fr}
  .edit-field.full{grid-column:1}
  .preview-fields{grid-template-columns:1fr}
  .pfield,.pfield.full{grid-column:1}
  .preview-topbar-btns .btn-text{display:none}
}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header-left">
      <span class="logo-badge">DAEWOONG</span>
      <h1>디지털헬스 제품 카탈로그</h1>
    </div>
    <div class="header-right no-print">
      <!-- Mobile: icon buttons -->
      <button class="icon-btn" id="mobile-filter-btn" onclick="toggleFilterDrawer()" title="필터">
        <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
      </button>
      <!-- Desktop: text buttons -->
      <button class="btn" onclick="exportPDF()">
        <svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2z"/><polyline points="14,2 14,8 20,8"/></svg>
        <span class="btn-label">PDF 저장</span>
      </button>
      <button class="btn" onclick="copyShareLink()">
        <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
        <span class="btn-label">링크 공유</span>
      </button>
    </div>
  </header>

  <div class="main">
    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sel-summary">
        <strong id="sel-count">0</strong>
        <span>개 제품 선택됨</span>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">질환 계통</div>
        <div id="filter-system"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">기능 분류</div>
        <div id="filter-function"></div>
      </div>
      <div class="sidebar-section">
        <div class="filter-item" onclick="clearFilters()" style="color:#185FA5;font-weight:500">
          <span style="font-size:12px">↺</span>&nbsp; 필터 초기화
        </div>
      </div>
      <div class="sidebar-section">
        <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="goPreview();closeSidebar()">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          미리보기 보기
        </button>
        <button class="btn" style="width:100%;justify-content:center;margin-top:6px" onclick="clearSelection();closeSidebar()">선택 초기화</button>
      </div>
    </aside>

    <main class="content">
      <div class="tabs no-print">
        <button class="tab active" id="tab-browse" onclick="switchTab('browse')">📋 전체 탐색</button>
        <button class="tab" id="tab-preview" onclick="switchTab('preview')">👁 미리보기</button>
        <button class="tab" id="tab-edit" onclick="switchTab('edit')">✏️ 편집</button>
      </div>

      <div id="pane-browse">
        <div class="grid" id="product-grid"></div>
      </div>

      <div id="pane-preview" style="display:none">
        <div id="preview-content"></div>
      </div>

      <div id="pane-edit" style="display:none">
        <div id="edit-content"></div>
        <button class="btn btn-primary" onclick="addProduct()" style="margin-top:8px">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          새 제품 추가
        </button>
      </div>
    </main>
  </div>

  <!-- Mobile: selected bar at bottom -->
  <div class="sel-bar no-print" id="sel-bar" style="display:none">
    <span id="sel-bar-text">0개 선택됨</span>
    <div style="display:flex;gap:8px">
      <button class="sel-bar-btn" onclick="copyShareLink()">공유</button>
      <button class="sel-bar-btn" onclick="goPreview()" style="background:rgba(255,255,255,.35);font-weight:600">미리보기 →</button>
    </div>
  </div>
</div>

<!-- Mobile filter drawer -->
<div class="filter-drawer" id="filter-drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-close">
    <button class="btn" style="padding:6px 12px;font-size:12px" onclick="closeFilterDrawer()">닫기</button>
  </div>
  <div style="margin-bottom:1rem">
    <div class="sidebar-title" style="margin-bottom:8px">질환 계통</div>
    <div id="drawer-filter-system"></div>
  </div>
  <div style="margin-bottom:1rem">
    <div class="sidebar-title" style="margin-bottom:8px">기능 분류</div>
    <div id="drawer-filter-function"></div>
  </div>
  <button class="btn" style="width:100%;justify-content:center;color:#185FA5;margin-top:4px" onclick="clearFilters();closeFilterDrawer()">
    ↺ 필터 초기화
  </button>
</div>
<div class="sidebar-overlay" id="drawer-overlay" onclick="closeFilterDrawer()" style="display:none;z-index:290"></div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'dh_catalog_v1';
let products = [];

function loadData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) { products = JSON.parse(saved); return; }
  fetch('data/products.json')
    .then(r => r.json())
    .then(data => { products = data.map(p => ({...p, selected:false})); saveData(); render(); })
    .catch(() => { products = getDefaultProducts(); saveData(); render(); });
}

function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(products)); }

// ── Render ──
function render() { renderGrid(); renderCategories(); updateSelCount(); }

let activeFilters = { system:null, func:null };

function renderGrid() {
  const grid = document.getElementById('product-grid');
  let list = products;
  if (activeFilters.system) list = list.filter(p => p.diseaseSystem === activeFilters.system);
  if (activeFilters.func)   list = list.filter(p => p.funcType === activeFilters.func);
  grid.innerHTML = list.map(p => `
    <div class="card ${p.selected?'selected':''}" onclick="toggleSelect(${p.id})">
      <div class="check-ring"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="card-img">
        ${p._imageData ? `<img src="${p._imageData}" alt="${p.name}">` : `<span>${p.icon||'📦'}</span>`}
      </div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-cat">${p.category}</div>
        <div class="card-dev">${p.developer}</div>
      </div>
    </div>`).join('');
}

function renderCategories() {
  const systems = [...new Set(products.map(p => p.diseaseSystem).filter(Boolean))];
  const funcs   = [...new Set(products.map(p => p.funcType).filter(Boolean))];
  const makeItem = (label, val, type) => {
    const isActive = activeFilters[type] === val;
    const count = products.filter(p => p[type==='system'?'diseaseSystem':'funcType'] === val).length;
    return `<div class="filter-item ${isActive?'filter-active':''}" onclick="toggleFilter('${type}','${val}');closeFilterDrawer()">
      <span style="font-size:12px;color:#aaa">›</span>
      <span>${label}</span>
      <span style="margin-left:auto;font-size:11px;color:#bbb">${count}</span>
    </div>`;
  };
  const emptyMsg = '<div style="font-size:12px;color:#bbb;padding:4px 8px">편집탭에서 입력하세요</div>';
  const sysHTML = systems.map(s => makeItem(s,s,'system')).join('') || emptyMsg;
  const fnHTML  = funcs.map(f => makeItem(f,f,'func')).join('') || emptyMsg;
  document.getElementById('filter-system').innerHTML = sysHTML;
  document.getElementById('filter-function').innerHTML = fnHTML;
  // drawer mirrors
  if (document.getElementById('drawer-filter-system')) {
    document.getElementById('drawer-filter-system').innerHTML = sysHTML;
    document.getElementById('drawer-filter-function').innerHTML = fnHTML;
  }
}

function updateSelCount() {
  const n = products.filter(p => p.selected).length;
  document.getElementById('sel-count').textContent = n;
  // mobile sel bar
  const bar = document.getElementById('sel-bar');
  if (bar) {
    bar.style.display = n > 0 ? 'flex' : 'none';
    document.getElementById('sel-bar-text').textContent = `${n}개 선택됨`;
  }
}

// ── Tabs ──
function switchTab(name) {
  ['browse','preview','edit'].forEach(t => {
    document.getElementById('pane-'+t).style.display = 'none';
    document.getElementById('tab-'+t).classList.remove('active');
  });
  document.getElementById('pane-'+name).style.display = 'block';
  document.getElementById('tab-'+name).classList.add('active');
  if (name==='preview') renderPreview();
  if (name==='edit') renderEdit();
  window.scrollTo(0,0);
}
function goPreview() { switchTab('preview'); }

// ── Selection ──
function toggleSelect(id) {
  const p = products.find(x => x.id===id);
  if (p) { p.selected = !p.selected; saveData(); render(); }
}
function clearSelection() { products.forEach(p => p.selected=false); saveData(); render(); }
function toggleFilter(type, val) {
  if (activeFilters[type]===val) activeFilters[type]=null; else activeFilters[type]=val;
  renderGrid(); renderCategories();
}
function clearFilters() { activeFilters={system:null,func:null}; renderGrid(); renderCategories(); }

// ── Mobile sidebar / filter drawer ──
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}
function toggleFilterDrawer() {
  const d = document.getElementById('filter-drawer');
  const o = document.getElementById('drawer-overlay');
  const isOpen = d.classList.contains('open');
  if (isOpen) { d.classList.remove('open'); o.style.display='none'; }
  else { d.classList.add('open'); o.style.display='block'; }
}
function closeFilterDrawer() {
  document.getElementById('filter-drawer').classList.remove('open');
  document.getElementById('drawer-overlay').style.display='none';
}

function openReport(id) {

}

function saveProduct(id) {
  const p = products.find(x => x.id===id);
  if (!p) return;
  p.name          = document.getElementById(`e-name-${id}`).value.trim()||p.name;
  p.category      = document.getElementById(`e-category-${id}`).value.trim()||p.category;
  p.developer     = document.getElementById(`e-developer-${id}`).value.trim();
  p.seller        = document.getElementById(`e-seller-${id}`).value.trim();
  p.desc          = document.getElementById(`e-desc-${id}`).value.trim();
  p.diseaseSystem = document.getElementById(`e-diseaseSystem-${id}`).value.trim();
  p.funcType      = document.getElementById(`e-funcType-${id}`).value.trim();
  p.targetDisease = document.getElementById(`e-targetDisease-${id}`).value.trim();
  p.billingCode   = document.getElementById(`e-billingCode-${id}`).value.trim();
  p.price         = document.getElementById(`e-price-${id}`).value.trim();
  p.indication    = document.getElementById(`e-indication-${id}`).value.trim();
  saveData(); render(); toast('저장되었습니다 ✓');
}

function uploadImage(id, input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const p = products.find(x => x.id===id);
    if (p) { p._imageData = e.target.result; saveData(); renderEdit(); toast('이미지 업로드 완료'); }
  };
  reader.readAsDataURL(file);
}

function uploadPDF(id, input) {
  const file = input.files[0]; if (!file) return;
  if (file.size > 10*1024*1024) { toast('파일 크기는 10MB 이하로 해주세요'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const p = products.find(x => x.id===id);
    if (p) { p._reportData = e.target.result; p.reportLabel = file.name; saveData(); renderEdit(); toast('PDF 업로드 완료'); }
  };
  reader.readAsDataURL(file);
}

function removeReport(event, id) {
  event.stopPropagation();
  const p = products.find(x => x.id===id);
  if (p) { p._reportData=null; p.reportLabel=''; saveData(); renderEdit(); }
}

function addHosp(id) {
  const inp = document.getElementById(`hosp-inp-${id}`);
  const val = inp.value.trim(); if (!val) return;
  const p = products.find(x => x.id===id);
  if (p) { p.hospitals.push(val); saveData(); renderEdit(); }
  inp.value = '';
}

function removeHosp(id, idx) {
  const p = products.find(x => x.id===id);
  if (p) { p.hospitals.splice(idx,1); saveData(); renderEdit(); }
}

function addProduct() {
  const newId = products.length ? Math.max(...products.map(x=>x.id))+1 : 1;
  products.push({id:newId, name:'새 제품', category:'카테고리', icon:'📦',
    developer:'', seller:'대웅제약', report:'', reportLabel:'',
    hospitals:[], desc:'', selected:false});
  saveData(); renderEdit(); toast('제품이 추가되었습니다');
}

function removeProduct(id) {
  if (!confirm('정말 삭제하시겠습니까?')) return;
  products = products.filter(x => x.id!==id);
  saveData(); render(); renderEdit(); toast('삭제되었습니다');
}

function copyShareLink() {
  const ids = products.filter(p=>p.selected).map(p=>p.id).join(',');
  const url = window.location.href.split('?')[0] + (ids?`?sel=${ids}`:'');
  navigator.clipboard.writeText(url)
    .then(()=>toast('링크가 복사되었습니다 ✓'))
    .catch(()=>prompt('아래 링크를 복사하세요:',url));
}

function exportPDF() { switchTab('preview'); setTimeout(()=>window.print(),300); }

function applyURLParams() {
  const params = new URLSearchParams(window.location.search);
  const sel = params.get('sel');
  if (sel) {
    const ids = sel.split(',').map(Number);
    products.forEach(p => { p.selected = ids.includes(p.id); });
    saveData();
  }
}

function esc(str) { return (str||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2500);
}
