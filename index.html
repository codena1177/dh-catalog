      토큰은 이 브라우저에만 저장되며 외부로 전송되지 않습니다.
    </div>

      <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    </div>
    <div class="modal-btns">
      <button class="btn btn-primary" id="token-save-btn" onclick="saveToken()">인증하고 시작</button>
      <button class="btn" onclick="closeTokenModal()">취소</button>
      <button class="btn btn-danger" onclick="clearToken()" style="margin-left:auto">토큰 삭제</button>

<!-- 저장 중 오버레이 -->
<div class="saving-overlay" id="saving-overlay" style="display:none">
  <div class="saving-spinner"></div>
  <div style="font-size:14px;color:#555">GitHub에 저장 중...</div>
</div>

<script>
// ── GitHub 설정 ────────────────────────────────────────────────────────
const GH_OWNER = 'codena1177';
const GH_REPO = 'dh-catalog';
const GH_FILE = 'products.json';  // repo 내 경로
const GH_BRANCH = 'main';
const TOKEN_KEY = 'gh_pat_dh_catalog';
const ADMIN_REQUESTED = new URLSearchParams(window.location.search).get('admin') === '1';
let isAdminMode = false;

function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
async function validateAdminToken(token) {
  const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}?_=${Date.now()}`, {
    cache: 'no-store',
    headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' }
  });
  if (!res.ok) throw new Error(res.status === 401 ? '토큰이 올바르지 않습니다.' : '저장소 편집 권한을 확인할 수 없습니다.');
  const repo = await res.json();
  const permissions = repo.permissions || {};
  if (!(permissions.push || permissions.admin || permissions.maintain)) throw new Error('이 토큰에는 저장소 편집 권한이 없습니다.');
  return true;
}
function setAdminMode(enabled) {
  isAdminMode = !!enabled;
  document.body.classList.toggle('viewer-mode', !isAdminMode);
  document.body.classList.toggle('admin-mode', isAdminMode);
  if (!isAdminMode && document.getElementById('pane-edit')?.style.display !== 'none') switchTab('browse');
  updateTokenBadge();
}
async function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) { alert('토큰을 입력하세요'); return; }
  const btn = document.getElementById('token-save-btn');
  btn.disabled = true; btn.textContent = '권한 확인 중...';
  try {
    await validateAdminToken(t);
    localStorage.setItem(TOKEN_KEY, t);
    closeTokenModal();
    setAdminMode(true);
    toast('관리자 모드로 접속했습니다 ✓');
  } catch (e) {
    alert(e.message || 'GitHub 인증에 실패했습니다.');
  } finally {
    btn.disabled = false; btn.textContent = '인증하고 시작';
  }
}
function clearToken() {
  localStorage.removeItem(TOKEN_KEY);
  closeTokenModal();
  setAdminMode(false);
  toast('토큰이 삭제되었습니다');
}
function exitAdminMode() {
  setAdminMode(false);
  const cleanUrl = new URL(window.location.href);
  cleanUrl.searchParams.delete('admin');
  history.replaceState({}, '', cleanUrl.pathname + cleanUrl.search + cleanUrl.hash);
  toast('뷰어 모드로 전환했습니다');
}
function openTokenModal() {
  document.getElementById('token-input').value = getToken();
  document.getElementById('token-modal').style.display = 'flex';
}
function closeTokenModal() { document.getElementById('token-modal').style.display = 'none'; }
function updateTokenBadge() {
  const badge = document.getElementById('token-status-badge');
  if (!badge) return;
  if (getToken()) {
    badge.className = 'token-status set';
    badge.textContent = '✅ GitHub 연동됨';
    badge.onclick = openTokenModal;
  } else {
    badge.className = 'token-status unset';
    badge.textContent = '🔑 GitHub 연동 필요';
    badge.onclick = openTokenModal;
  }
}
async function initializeAccessMode() {
  setAdminMode(false);
  if (!ADMIN_REQUESTED) return;
  const token = getToken();
  if (!token) { openTokenModal(); return; }
  try {
    await validateAdminToken(token);
    setAdminMode(true);
  } catch (e) {
    localStorage.removeItem(TOKEN_KEY);
    openTokenModal();
    toast('관리자 인증이 만료되었습니다. 다시 인증해주세요');
  }
}

// ── GitHub API로 products.json 저장 ───────────────────────────────────
async function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

async function saveToGitHub(newProducts) {
  const token = getToken();
  if (!token) {
    openTokenModal();
    throw new Error('토큰 없음');
  }

  // 저장할 데이터: selected, _imageData 등 UI 전용 필드 제외
  const cleanProducts = newProducts.map(p => {
    const { selected, _imageData, _reportData, _ghImageUrl, ...clean } = p;
    return clean;
  });

  const content = btoa(unescape(encodeURIComponent(JSON.stringify(cleanProducts, null, 2))));
  const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`;

  // GitHub Pages/브라우저 캐시 또는 거의 동시에 저장 버튼을 누르는 경우 SHA 충돌이 날 수 있어 3회 재시도
  for (let attempt = 1; attempt <= 3; attempt++) {
    const getRes = await fetch(`${url}?ref=${GH_BRANCH}&_=${Date.now()}`, {
      cache: 'no-store',
      headers: {
        Authorization: `Bearer ${token}`,
        Accept: 'application/vnd.github+json'
      }
    });

    if (!getRes.ok) {
      const err = await getRes.json().catch(() => ({}));
      throw new Error(err.message || 'GitHub 파일 조회 실패');
    }

    const fileInfo = await getRes.json();

    const putRes = await fetch(url, {
      method: 'PUT',
      cache: 'no-store',
      headers: {
        Authorization: `Bearer ${token}`,
        Accept: 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: '카탈로그 제품 정보 업데이트',
        content,
        sha: fileInfo.sha,
        branch: GH_BRANCH
      })
    });

    if (putRes.ok) return await putRes.json();

    const err = await putRes.json().catch(() => ({}));
    const msg = err.message || 'GitHub 저장 실패';

    // SHA 불일치/409 충돌이면 최신 SHA를 다시 받아 재시도
    if ((putRes.status === 409 || msg.includes('does not match')) && attempt < 3) {
      await wait(900 * attempt);
      continue;
    }

    throw new Error(msg);
  }
}

// ── State ──────────────────────────────────────────────────────────────
const STORAGE_KEY = 'dh_catalog_v2';
const HIDDEN_KEY = 'dh_hidden_ids';
let products = [];

function getProductImageSrc(p) {
  return p._imageData || p._ghImageUrl || (p.image ? `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${p.image}` : '');
}

function getProductReportSrc(p) {
  return p.reportPath ? encodeURI(p.reportPath) : '';
}

function imageFallback(el, icon) {
  const box = el.parentElement;
  if (!box) return;
  box.classList.remove('has-image');
  box.innerHTML = `<span style="font-size:42px">${icon || '📦'}</span>`;
}


function cleanupMediaBoxes() {
  document.querySelectorAll('.card-img, .preview-img').forEach(box => {
    const img = box.querySelector('img');
    if (!img) return;
    box.classList.add('has-image');
    Array.from(box.childNodes).forEach(node => {
      if (node !== img) node.remove();
    });
  });
}

function productMediaHTML(p, boxClass) {
  const src = getProductImageSrc(p);
  const safeName = esc(p.name || '제품 이미지');
  const safeIcon = esc(p.icon || '📦');
  if (!src) return `<div class="${boxClass}"><span style="font-size:42px">${safeIcon}</span></div>`;
  return `<div class="${boxClass} has-image"><img src="${src}" alt="${safeName}" onerror="imageFallback(this, '${safeIcon}')"></div>`;
}

function loadData() {
  fetch('products.json?v=' + Date.now())
    .then(r => r.json())
    .then(data => {
      const savedSel = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      const DEFAULT_HIDDEN = [18, 19, 20];
      const storedHidden = JSON.parse(localStorage.getItem(HIDDEN_KEY) || 'null');
      const hiddenIds = storedHidden !== null ? storedHidden : DEFAULT_HIDDEN;
      if (storedHidden === null) localStorage.setItem(HIDDEN_KEY, JSON.stringify(DEFAULT_HIDDEN));
      data = data.filter(p => !hiddenIds.includes(p.id));
      products = data.map(p => ({
        ...p,
        selected: savedSel[p.id]?.selected || false,
        _imageData: savedSel[p.id]?._imageData || null,
        _ghImageUrl: p.image ? `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${p.image}` : (savedSel[p.id]?._ghImageUrl || null),
        // PDF 본문은 브라우저에 저장하지 않고 GitHub 파일 경로만 사용합니다.
        _reportData: null,
        reportPath: p.reportPath || '',
        reportLabel: p.reportLabel || '',
        diseaseSystem: p.diseaseSystem || savedSel[p.id]?.diseaseSystem || '',
        funcType: p.funcType || savedSel[p.id]?.funcType || '',
        targetDisease: p.targetDisease || savedSel[p.id]?.targetDisease || '',
        billingCode: p.billingCode || savedSel[p.id]?.billingCode || '',
        price: p.price || savedSel[p.id]?.price || '',
        indication: p.indication || savedSel[p.id]?.indication || '',
        hospitals: p.hospitals || savedSel[p.id]?.hospitals || [],
      }));
      applyURLParams();
      render();
      updateTokenBadge();
    })
    .catch(() => {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) { const savedObj = JSON.parse(saved); products = Object.values(savedObj); }
      applyURLParams();
      render();
      updateTokenBadge();
    });
}

function saveLocalData() {
  const obj = {};
  products.forEach(p => {
    const { _reportData, ...localProduct } = p;
    obj[p.id] = localProduct;
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
}

// ── Render ─────────────────────────────────────────────────────────────
function render() { renderGrid(); renderCategories(); updateSelCount(); }
function renderGrid() {
  const grid = document.getElementById('product-grid');
  let list = products;
  if (activeFilters.system) list = list.filter(p => p.diseaseSystem === activeFilters.system);
  if (searchQuery) list = list.filter(p => [p.name,p.category,p.desc,p.developer,p.diseaseSystem,p.funcType].join(' ').toLowerCase().includes(searchQuery));
  const order = ['예방·예측','진단','치료','사후관리','미분류'];
  const groups = order.map(type => ({ type, items:list.filter(p => (p.funcType || '미분류') === type) })).filter(g => g.items.length);
  document.getElementById('section-jumps').innerHTML = groups.map(g => `
    <button class="section-jump" onclick="scrollToProductSection('${g.type}')">
      <span class="section-dot" style="background:${sectionMeta[g.type].color}"></span>${g.type}
    </button>`).join('');
  if (!groups.length) {
    grid.innerHTML = '<div class="empty"><p>조건에 맞는 제품이 없습니다</p></div>';
    return;
  }
  grid.innerHTML = groups.map(group => `
    <section class="product-section" id="product-section-${group.type}">
      <div class="product-section-header">
        <span class="section-dot" style="background:${sectionMeta[group.type].color}"></span>
        <span class="product-section-title">${group.type}</span>
        <span class="product-section-count">${group.items.length}개</span>
        <span class="product-section-desc">${sectionMeta[group.type].desc}</span>
      </div>
      <div class="grid">${group.items.map(p => `
    <div class="card ${p.selected ? 'selected' : ''}" onclick="toggleSelect(${p.id})">
      <div class="check-ring"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      ${productMediaHTML(p, 'card-img')}
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-cat">${p.category}</div>
        <div class="card-dev">${p.developer}</div>
      </div>
    </div>`).join('')}</div>
    </section>`).join('');
  cleanupMediaBoxes();
}
function renderCategories() {
  const systems = [...new Set(products.map(p => p.diseaseSystem).filter(Boolean))];
  const makeItem = (label, val, type) => {
    const isActive = activeFilters[type] === val;
    const count = products.filter(p => p[type === 'system' ? 'diseaseSystem' : 'funcType'] === val).length;
    return `<div class="filter-item ${isActive ? 'filter-active' : ''}" onclick="toggleFilter('${type}','${val}')">
      <span style="font-size:12px;color:#aaa">›</span>
      <span>${label}</span>
      <span style="margin-left:auto;font-size:11px;color:#bbb">${count}</span>
    </div>`;
  };
  document.getElementById('filter-system').innerHTML =
    systems.map(s => makeItem(s, s, 'system')).join('') ||
    '<div style="font-size:12px;color:#bbb;padding:4px 8px">편집탭에서 입력하세요</div>';
}
function updateSelCount() {
  document.getElementById('sel-count').textContent = products.filter(p => p.selected).length;
}

// ── Tabs ───────────────────────────────────────────────────────────────
function switchTab(name) {
  if (name === 'edit' && !isAdminMode) {
    toast('관리자 인증 후 편집할 수 있습니다');
    return;
  }
  ['browse','preview','edit'].forEach(t => {
    document.getElementById('pane-' + t).style.display = 'none';
    document.getElementById('tab-' + t).classList.remove('active');
  });
  document.getElementById('pane-' + name).style.display = 'block';
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'preview') renderPreview();
  if (name === 'edit') renderEdit();
}
function goPreview() { switchTab('preview'); }
function toggleMobileFilters() {
  const opened = document.body.classList.toggle('mobile-filters-open');
  const chevron = document.getElementById('mobile-filter-chevron');
  if (chevron) chevron.textContent = opened ? '⌃' : '⌄';
}

  products.forEach(p => p.selected = false);

function captureAllEditForms() {
  products.forEach(p => {
    if (document.getElementById(`e-name-${p.id}`)) updateProductFromForm(p.id);
  });
}

function moveProduct(id, direction) {
  captureAllEditForms();
  const from = products.findIndex(p => p.id === id);
  if (from < 0) return;
  const to = from + direction;
  if (to < 0 || to >= products.length) return;

  const [moved] = products.splice(from, 1);
  products.splice(to, 0, moved);
  saveLocalData();
  render();
  renderEdit();

  requestAnimationFrame(() => {
    document.getElementById(`ec-${id}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  toast(`↔️ ${moved.name} 순서 변경됨. 전체 저장을 눌러 반영하세요`);
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function loadImageElement(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function resizeImageToWebP(file, maxSize = 800, quality = 0.86) {
  const originalDataUrl = await readFileAsDataURL(file);
  const img = await loadImageElement(originalDataUrl);
  const ratio = Math.min(1, maxSize / Math.max(img.width, img.height));
  const width = Math.max(1, Math.round(img.width * ratio));
  const height = Math.max(1, Math.round(img.height * ratio));
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, width, height);
  ctx.drawImage(img, 0, 0, width, height);
  return canvas.toDataURL('image/webp', quality);
}

async function uploadImage(id, input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('이미지 파일만 업로드할 수 있습니다'); return; }
  if (file.size > 10 * 1024 * 1024) { toast('원본 파일은 10MB 이하로 업로드해주세요'); return; }

  const p = products.find(x => x.id === id);
  if (!p) return;

  document.getElementById('saving-overlay').style.display = 'flex';
  try {
    const dataUrl = await resizeImageToWebP(file, 800, 0.86);

    // 즉시 미리보기 반영
    p._imageData = dataUrl;
    saveLocalData();
    render();
    renderEdit();

    if (!getToken()) {
      toast('이미지는 미리보기만 반영됨. GitHub 토큰 설정 후 다시 업로드하면 사이트에 저장됩니다');
      openTokenModal();
      return;
    }

    const base64Data = dataUrl.split(',')[1];
    const safeName = (p.name || 'product').replace(/[\\/:*?"<>|\s]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase();
    const fileName = `product-${id}-${safeName || 'image'}-${Date.now()}.webp`;
    const ghPath = `assets/images/${fileName}`;

    const putRes = await fetch(
      `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${ghPath}`,
      {
        method: 'PUT',
        headers: {
          Authorization: `Bearer ${getToken()}`,
          Accept: 'application/vnd.github+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `제품 이미지 업로드: ${p.name}`,
          content: base64Data,
          branch: GH_BRANCH
        })
      }
    );

    if (!putRes.ok) {
      const err = await putRes.json().catch(() => ({}));
      throw new Error(err.message || '이미지 업로드 실패');
    }

    p.image = ghPath;
    p._ghImageUrl = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${ghPath}`;
    saveLocalData();
    await saveToGitHub(products);
    render();
    renderEdit();
    toast('✅ 이미지 업로드 완료! 1~2분 후 사이트에 반영됩니다');
  } catch(err) {
    console.error(err);
    toast('❌ 이미지 업로드 실패: ' + err.message);
  } finally {
    document.getElementById('saving-overlay').style.display = 'none';
  }
}

async function removeProduct(id) {
  if (!confirm('정말 삭제하시겠습니까?')) return;
  const hiddenIds = JSON.parse(localStorage.getItem(HIDDEN_KEY) || '[]');
  if (!hiddenIds.includes(id)) { hiddenIds.push(id); }
  localStorage.setItem(HIDDEN_KEY, JSON.stringify(hiddenIds));
  products = products.filter(x => x.id !== id);
  saveLocalData(); render(); renderEdit();

  if (getToken()) {
    document.getElementById('saving-overlay').style.display = 'flex';
    try {
      await saveToGitHub(products);
      toast('✅ 삭제 후 GitHub에 저장됨');
    } catch(e) {
      toast('❌ GitHub 저장 실패: ' + e.message);
    } finally {
      document.getElementById('saving-overlay').style.display = 'none';
    }
  } else {
    toast('삭제되었습니다 (GitHub 토큰 설정 시 사이트에 반영)');
  }
}

  }
}

function esc(str) { return (str||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

initializeAccessMode();
loadData();
</script>
</body>
</html>
